apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressjs-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expressjs-service
  template:
    metadata:
      labels:
        app: expressjs-service
    spec:
      containers:
        - name: app
          image: example/expressjs-service:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: NODE_ENV
              value: production
